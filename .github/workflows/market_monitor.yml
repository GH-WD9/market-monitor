name: Market Monitor

on:
  schedule:
    - cron: "0 23 * * *"   # 23:00 UTC = 07:00 SGT
    - cron: "0 11 * * *"   # 11:00 UTC = 19:00 SGT
  workflow_dispatch:         # manual trigger for testing

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Phase 4c: publish step commits docs/index.html
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run Market Monitor
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python market_monitor.py

      # Phase 4c — publish the report to GitHub Pages.
      # Without this the Pages site has nothing to serve: market_monitor.py
      # writes docs/index.html into the runner's workspace, which is discarded
      # when the job ends. The file is force-added because .gitignore excludes
      # docs/* by default (only index.html is tracked, D2).
      - name: Publish report to GitHub Pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/index.html
          if git diff --staged --quiet; then
            echo "No change in docs/index.html — nothing to publish."
          else
            git commit -m "Market Monitor report $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
